[package]
name = "opentermius-ui"
version = "0.3.3"
edition = "2024"
publish = false
license = "UNLICENSED"

# This crate contains only generated code. Its API is exercised by the app and
# integration suite; do not compile a second copy for an empty test harness.
[lib]
test = false
doctest = false

[features]
live-preview = ["slint/live-preview"]

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-18"] }

[build-dependencies]
slint-build = "=1.18.1"
