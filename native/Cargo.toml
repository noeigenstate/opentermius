[package]
name = "opentermius"
version = "0.2.0"
edition = "2024"
description = "A lightweight, local-first SSH and SFTP client"
repository = "https://github.com/noeigenstate/opentermius"
license = "UNLICENSED"
build = "build.rs"

[dependencies]
anyhow = "1"
arboard = { version = "3", default-features = false }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6"
image = { version = "0.25", default-features = false, features = ["png"] }
portable-pty = "0.9"
rfd = { version = "0.17", default-features = false }
raw-window-handle = "0.6"
shlex = "2"
russh = { version = "0.64.1", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "3.0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-18", "raw-window-handle-06"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "fs"] }
uuid = { version = "1", features = ["v4", "serde"] }
vt100 = "0.18.1"
zeroize = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Memory", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Storage_FileSystem"] }

[build-dependencies]
slint-build = "=1.18.1"
winresource = "0.1"

[dev-dependencies]
tempfile = "3"

[profile.dev]
# Keep line tables for backtraces/debugging but drop full type/variable debuginfo:
# less metadata to generate, copy, and link on every incremental rebuild.
debug = "line-tables-only"

# Dependencies are not rebuilt during normal incremental work, and their full
# debuginfo only bloats link inputs. Keep our own crate at the defaults.
[profile.dev.package."*"]
debug = false

# Local release-like builds: fast to compile, not for shipping.
# The shipping [profile.release] below stays unchanged.
[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
