name: Desktop CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: native
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: native/web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # Ayatana is the AppIndicator implementation in current Tauri prerequisites.
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libxdo-dev fonts-dejavu-core shellcheck
      - name: Check release versions and version-check tests
        run: |
          node scripts/check-versions.mjs
          node --test scripts/check-versions.test.mjs
      - name: Install frontend dependencies
        working-directory: native/web
        run: npm ci
      - name: Build frontend
        working-directory: native/web
        run: npm run build
      - name: Check packaging scripts
        if: runner.os == 'Linux'
        run: shellcheck scripts/package-macos.sh scripts/package-linux.sh
      - name: Build
        run: cargo build --locked --workspace
      - name: Test workspace (consolidated integration suite; desktop tests stay ignored)
        run: cargo test --locked --workspace
      - name: Build release with embedded frontend
        run: cargo build --release --locked -p opentermius-desktop --features tauri/custom-protocol
      - name: Upload release executable
        uses: actions/upload-artifact@v4
        with:
          name: OpenTermius-${{ runner.os }}-${{ runner.arch }}
          path: |
            native/target/release/opentermius
            native/target/release/opentermius.exe
          if-no-files-found: error
