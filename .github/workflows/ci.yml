name: Native CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: native
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev libfreetype6-dev libwayland-dev libx11-dev libx11-xcb-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxrandr-dev libxi-dev libxcursor-dev libgl1-mesa-dev fonts-dejavu-core shellcheck
      - name: Check packaging scripts
        if: runner.os == 'Linux'
        run: shellcheck scripts/package-macos.sh scripts/package-linux.sh
      - name: Build
        run: cargo build --locked
      - name: Test (interactive desktop tests stay ignored)
        run: cargo test --locked
      - name: Build release
        run: cargo build --release --locked
      - name: Upload release executable
        uses: actions/upload-artifact@v4
        with:
          name: OpenTermius-${{ runner.os }}-${{ runner.arch }}
          path: |
            native/target/release/opentermius
            native/target/release/opentermius.exe
          if-no-files-found: error
