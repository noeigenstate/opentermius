name: Windows installer

"on":
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows x64 installer
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: native
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: native/web/package-lock.json

      - name: Check release versions and version-check tests
        run: |
          node scripts/check-versions.mjs
          node --test scripts/check-versions.test.mjs

      - name: Check tag version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = node scripts/check-versions.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Release versions do not match.' }
          if ($env:RELEASE_TAG -cnotmatch '^v[0-9]+\.[0-9]+\.[0-9]+$' -or $env:RELEASE_TAG -cne "v$version") {
            throw "Release tag '$env:RELEASE_TAG' must match Tauri version 'v$version'."
          }

      - name: Install stable Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "native -> target"

      - name: Install frontend dependencies
        working-directory: native/web
        run: npm ci

      - name: Build frontend
        working-directory: native/web
        run: npm run build

      - name: Build workspace
        run: cargo build --locked --workspace

      - name: Test workspace (consolidated integration suite)
        run: cargo test --locked --workspace

      - name: Build release with embedded frontend
        run: cargo build --release --locked -p opentermius-desktop --features tauri/custom-protocol

      - name: Locate or install NSIS
        id: nsis
        run: |
          function Find-Nsis {
            $command = Get-Command makensis.exe -CommandType Application -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($command) { return $command.Source }
            foreach ($root in @(${env:ProgramFiles(x86)}, $env:ProgramFiles)) {
              if ($root) {
                $candidate = Join-Path $root 'NSIS/makensis.exe'
                if (Test-Path -LiteralPath $candidate -PathType Leaf) { return $candidate }
              }
            }
          }
          $makensis = Find-Nsis
          if (-not $makensis) {
            choco install nsis -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'NSIS 安装失败。' }
            $makensis = Find-Nsis
          }
          if (-not $makensis) { throw '未找到 makensis.exe，无法生成 Windows 安装程序。' }
          "path=$makensis" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Package NSIS installer
        working-directory: .
        env:
          MAKENSIS_PATH: ${{ steps.nsis.outputs.path }}
          OPENTERMIUS_TEST_EXECUTABLE: ${{ github.workspace }}/native/target/release/opentermius.exe
        run: ./native/scripts/package.ps1 -SkipBuild -MakensisPath $env:MAKENSIS_PATH

      - name: Verify silent install, upgrade and uninstall
        run: ./installer/verify-install.ps1

      - name: Upload installer and SHA-256 manifest
        uses: actions/upload-artifact@v4
        with:
          name: OpenTermius-windows-x64-setup
          path: |
            native/releases/OpenTermius-*-windows-x64-setup.exe
            native/releases/checksums.json
          if-no-files-found: error

  release:
    name: Publish Windows installer
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: OpenTermius-windows-x64-setup
          path: native/releases

      - name: Prepare release notes
        run: |
          $manifest = Get-Content -LiteralPath native/releases/checksums.json -Raw | ConvertFrom-Json
          $installers = @(Get-ChildItem -Path native/releases/OpenTermius-*-windows-x64-setup.exe -File)
          if ($installers.Count -ne 1) { throw '发布产物必须包含且仅包含一个 Windows 安装程序。' }
          $installer = $installers[0]
          $sha256 = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($manifest.file -cne $installer.Name -or $manifest.sha256 -cne $sha256) {
            throw '安装程序与 checksums.json 中的文件名或 SHA-256 不一致。'
          }
          @(
            'Windows x64 NSIS installer.'
            ''
            'This installer is unsigned. Windows SmartScreen may display a warning.'
            ''
            'Requires Microsoft Edge WebView2 Runtime. Setup installs it when missing (internet required).'
            ''
            "SHA-256 ($($installer.Name)):"
            '```text'
            $sha256
            '```'
            ''
            'The same SHA-256 is included in the attached checksums.json.'
          ) | Set-Content -LiteralPath release-notes.md -Encoding utf8

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            native/releases/OpenTermius-*-windows-x64-setup.exe
            native/releases/checksums.json
          fail_on_unmatched_files: true
